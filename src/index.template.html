<link rel="canonical" href="https://nguyenhanhatminh0105-hue.github.io/voxel-qr-tree/canvas.html">
<!-- Social preview. The artifact is the pitch, so a shared link has to show the
     diorama rather than a bare URL. docs/og.png is a real render at the 1200x630
     card ratio, not a crop of the wide preview sheet. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="QR Arboretum">
<meta property="og:title" content="QR Arboretum (canvas 2D)">
<meta property="og:description" content="Type a URL. It grows into an isometric voxel tree. Tap the plot and the whole diorama reads as a scannable QR code.">
<meta property="og:url" content="https://nguyenhanhatminh0105-hue.github.io/voxel-qr-tree/canvas.html">
<meta property="og:image" content="https://nguyenhanhatminh0105-hue.github.io/voxel-qr-tree/docs/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="An isometric voxel cherry tree on a square plot whose paving spells out a QR code.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="QR Arboretum (canvas 2D)">
<meta name="twitter:description" content="Type a URL. It grows into an isometric voxel tree that reads as a scannable QR code from directly overhead.">
<meta name="twitter:image" content="https://nguyenhanhatminh0105-hue.github.io/voxel-qr-tree/docs/og.png">
<!-- Matches --page in each scheme. Without these the browser chrome stays
     light while the page paints #17150f, which reads as a rendering fault
     on mobile rather than a theme. -->
<meta name="theme-color" content="#edeae3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Grow a URL into an isometric voxel tree that reads as a scannable QR code from directly overhead.">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <header>
    <!-- The claim, stated. Every visible string in the build used to be the
         wordmark, a hint, two button labels and three transient messages - the
         sentence that sells the project lived in og:description, where only a
         link-unfurler ever read it. A visitor's first question is "is this
         real?", so the page answers it before they scroll. -->
    <div class="brand">
      <h1>QR Arboretum</h1>
      <p class="claim">Every voxel stands on a dark module. From directly
        overhead, the diorama <em>is</em> the QR code.</p>
    </div>
    <!-- translate="no": the value is a machine identifier, and a page
         translator rewriting it would silently encode a different link. -->
    <input id="url" name="url" type="url" inputmode="url" spellcheck="false"
           autocomplete="off" translate="no"
           placeholder="https://example.com" aria-label="URL to encode">
  </header>

  <div id="stagewrap">
    <canvas id="stage"></canvas>
    <div class="hint">tap the plot to look straight down</div>
  </div>

  <footer>
    <div id="tabs" role="group" aria-label="Season"></div>
    <div id="swatches" role="group" aria-label="Foliage colour"></div>
    <div class="actions">
      <button id="flip" type="button">Flip to code</button>
      <button id="png" type="button">PNG</button>
    </div>
    <!-- Kept, but empty unless there is something to say: an encode
         error, the empty-input prompt, or a save confirmation. .scan:empty
         collapses it, so nothing shows in the normal case. -->
    <div id="scan" class="scan" aria-live="polite"></div>
  </footer>
</div>
